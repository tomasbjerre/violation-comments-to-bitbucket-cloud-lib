plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.2.1"
}

javaExtension {
	javaVersion = 17
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}


dependencies {
	api "se.bjurr.violations:violation-comments-lib:1.109.3"
	api "se.bjurr.bitbucketcloud:bitbucket-cloud-java-rest-api:3.0.0"
	api "org.jboss.resteasy:resteasy-client:7.0.4.Final"
	api "org.jboss.resteasy:resteasy-multipart-provider:7.0.4.Final"
	api "tools.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:3.0.0-rc4"
	api "org.slf4j:slf4j-simple:2.0.19"
	api 'javax.ws.rs:javax.ws.rs-api:2.1.1'

	testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
	testImplementation "org.junit.jupiter:junit-jupiter-engine:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
	testImplementation "org.assertj:assertj-core:3.27.7"
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
}

configurations.all {
	resolutionStrategy {
		// violations-lib 2.0.x/2.1.x shaded jackson-databind under its original package name,
		// colliding with the real tools.jackson.core:jackson-databind on the classpath. Force the
		// newer version, which no longer shades it, until violation-comments-lib bumps its own
		// dependency.
		force "se.bjurr.violations:violations-lib:2.2.0"
	}
}
