plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.3.0"
}

javaExtension {
	javaVersion = 17
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}


dependencies {
	api "se.bjurr.violations:violation-comments-lib:1.111.0"
	api "se.bjurr.bitbucketcloud:bitbucket-cloud-java-rest-api:3.0.0"
	api "org.jboss.resteasy:resteasy-client:7.0.4.Final"
	api "org.jboss.resteasy:resteasy-multipart-provider:7.0.4.Final"
	api "tools.jackson.core:jackson-databind:3.2.2"
	api "org.slf4j:slf4j-simple:2.0.19"
	api 'javax.ws.rs:javax.ws.rs-api:2.1.1'

	testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
	testImplementation "org.junit.jupiter:junit-jupiter-engine:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
	testImplementation "org.assertj:assertj-core:3.27.7"
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
}
